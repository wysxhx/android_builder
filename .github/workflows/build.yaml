name: android_build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # 用 deadsnakes 安装 python3.8
      - name: Install Python3.8
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.8 python3.8-dev
      - name: Set Python env for chaquopy
        run: echo "BUILD_PYTHON=/usr/bin/python3.8" >> $GITHUB_ENV

      - name: Check project-to-build file
        run: |
          ls -la
          cat project-to-build

      - id: get-project
        name: Get project name
        run: echo "PROJECT=$(cat project-to-build)" >> $GITHUB_ENV

      - name: Clone project
        run: git clone --depth=1 ${{ env.PROJECT }} project

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > ./project/local.properties

      - name: Build the app
        working-directory: ./project
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-build-apk
          path: ./project/**/*.apk
