name: Build TVBoxOS Java
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: wysxhx/TVBoxOS
          path: TVBoxOS

      # 先装Java17，给sdkmanager运行用
      - name: Setup JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 再切回JDK11，给Gradle编译TVBox项目
      - name: Switch to JDK 11 for project build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('TVBoxOS/**/*.gradle*') }}

      - name: 替换maven镜像为阿里云（build+settings）
        working-directory: TVBoxOS
        run: |
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' build.gradle
          sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' build.gradle
          if [ -f settings.gradle ]; then
            sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' settings.gradle
            sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' settings.gradle
          fi

      - name: Build assembleJavaDebug
        working-directory: TVBoxOS
        run: |
          chmod +x ./gradlew
          ./gradlew assembleJavaDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Java-Debug
          path: TVBoxOS/app/build/outputs/apk/debug/*.apk
