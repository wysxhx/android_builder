name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取 TVBoxOS 源码
        uses: actions/checkout@v4
        with:
          repository: wysxhx/TVBoxOS
          path: TVBoxOS

      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 安装 Python 3.8（给 Python 爬虫用）
        run: |
          sudo apt update
          sudo apt install -y python3.8 python3.8-dev python3.8-venv python3.8-distutils gcc g++ libffi-dev libssl-dev

      - name: 编译 Debug 包
        working-directory: TVBoxOS
        run: |
          chmod +x ./gradlew
          ./gradlew assembleJavaDebug --info

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-debug-apk
          path: TVBoxOS/app/build/outputs/apk/debug/*.apk
