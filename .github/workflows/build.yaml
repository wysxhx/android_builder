name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TVBoxOS source
        uses: actions/checkout@v4
        with:
          repository: wysxhx/TVBoxOS
          path: TVBoxOS

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Python3.8
        run: |
          sudo apt update
          sudo apt install -y python3.8 python3.8-dev python3.8-venv python3.8-distutils gcc g++ libffi-dev libssl-dev

      - name: Build JavaDebug APK
        working-directory: TVBoxOS
        run: |
          chmod +x ./gradlew
          ./gradlew assembleJavaDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-debug-apk
          path: TVBoxOS/app/build/outputs/apk/debug/*.apk
