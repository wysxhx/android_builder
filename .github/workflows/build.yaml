name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies & Python3.8
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt update
          sudo apt install -y python3.8 python3.8-dev python3.8-venv python3.8-distutils gcc g++ libffi-dev libssl-dev
          python3.8 -c "import distutils.util; print('distutils ok')"

      - name: Patch build.gradle replace windows python path
        run: |
          cd pyramid
          sed -i 's|D:/python38/python.exe|/usr/bin/python3.8|g' build.gradle

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: pyramid/build/outputs/apk/debug/*.apk
